name: Update data and deploy

on:
  schedule:
    - cron: "20 10 * * 1-5"
    - cron: "20 22 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lookout
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Fetch prices
        if: github.event_name != 'push'
        run: python scripts/fetch.py
      - name: Analyze and export
        if: github.event_name != 'push'
        run: |
          python scripts/analyze.py
          python scripts/export.py
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "lookout-bot"
          git config user.email "lookout-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - run: touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
